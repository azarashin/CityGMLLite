[workspace]
members = [
    "crates/citymodel-core",
    "crates/citymodel-citygml",
    "crates/citymodel-coordinate",
    "crates/citymodel-geometry",
    "crates/citymodel-tiling",
    "crates/citymodel-gltf",
    "crates/citymodel-spatialite",
    "crates/citymodel-validation",
    "crates/citymodel-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/azarashin/CityGMLLite"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
